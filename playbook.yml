---
# Simple calling playbook for exercising this collection's roles locally,
# straight against roles/ in this repo - no `ansible-galaxy install` needed
# to run this. A real consuming playbook elsewhere would reference roles via
# the blacknell.ansible_roles FQCN instead (see README.md).
#
# Usage:
#   ansible-playbook -i inventory playbook.yml --check --diff
#

- name: Configure time sync on Debian hosts
  hosts: virtual_machines:docker
  gather_facts: true
  become: true
  vars:
    timesync_ntp_servers:
      - 0.uk.pool.ntp.org
      - 1.uk.pool.ntp.org
      - 2.uk.pool.ntp.org
      - 3.uk.pool.ntp.org
  roles:
    - timesync
