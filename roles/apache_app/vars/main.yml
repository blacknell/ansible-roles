---
__apache_app_web: "{{ apache_app_name }}-web"
__apache_app_db: "{{ apache_app_name }}-db"
# Apache always gets remoteip, so logs and the app see the real client IP
__apache_app_modules: "{{ (apache_app_apache_modules + ['remoteip']) | unique }}"
# uid/gid of www-data in the official php images
__apache_app_www_uid: 33
__apache_app_vhost_defaults:
  aliases: []
  env: {}
  extra_config: ""
