---
argument_specs:
  main:
    short_description: Update all apt packages, clean up, and report or do any reboot needed
    options:
      update_debian_cache_valid_time:
        type: int
        default: 3600
        description: Refresh the apt cache first if it's older than this many seconds. 0 always refreshes.
      update_debian_upgrade:
        type: str
        default: dist
        choices: [dist, full, safe]
        description: Kind of upgrade, passed to the apt module's upgrade option.
      update_debian_autoclean:
        type: bool
        default: true
        description: Run apt-get autoclean.
      update_debian_autoremove:
        type: bool
        default: true
        description: Run apt-get autoremove.
      update_debian_skip_openmediavault:
        type: bool
        default: true
        description: Skip hosts with openmediavault installed.
      update_debian_reboot:
        type: bool
        default: false
        description: Reboot when the upgrade leaves /var/run/reboot-required.
      update_debian_reboot_timeout:
        type: int
        default: 600
        description: Seconds to wait for the host to come back after a reboot.
