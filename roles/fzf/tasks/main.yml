---
# tasks file for fzf

# Re-gather facts here with become: false, regardless of whether the calling
# play sets become: true. The setup module's user_dir/user_shell come from
# pwd.getpwuid(os.getuid()) at the moment it runs - under become that's the
# become_user (root by default), not ansible_user. Without this, a play with
# become: true would silently target root's home instead of ansible_user's.
- name: re-gather facts as ansible_user (not become-escalated)
  become: false
  setup:

- name: Install fzf package (Debian)
  when: ansible_facts['distribution'] == 'Debian'
  apt:
    name:
      - fzf
    state: latest
    autoremove: true
    autoclean: true

# Homebrew refuses to run as root, so this must run as the connecting user
# even under a play that sets become: true for everything else.
- name: Install fzf package (macOS)
  when: ansible_facts['os_family'] == 'Darwin'
  become: false
  community.general.homebrew:
    name: fzf
    state: latest
    update_homebrew: true

# eval "$(fzf --bash)" / source <(fzf --zsh) ask the fzf binary itself to
# print its own shell-integration script, rather than sourcing a static
# key-bindings file at a hardcoded path. That path varies by package manager
# (Debian's apt layout vs Homebrew's Cellar, which itself differs between
# Apple Silicon /opt/homebrew and Intel /usr/local) - fzf's own README now
# recommends this approach over sourcing individual files for that reason.
- name: Install fzf key bindings (bash)
  when: (ansible_facts['user_shell'] | basename) == 'bash'
  blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    prepend_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK - FZF KEY BINDINGS"
    block: |
      eval "$(fzf --bash)"

- name: Install fzf key bindings (zsh)
  when: (ansible_facts['user_shell'] | basename) == 'zsh'
  blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.zshrc"
    prepend_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK - FZF KEY BINDINGS"
    block: |
      source <(fzf --zsh)
