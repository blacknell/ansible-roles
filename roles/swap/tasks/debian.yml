---
- name: Check for an existing swap file
  ansible.builtin.stat:
    path: "{{ swap_file_path }}"
  register: swap_file

# Resizing would mean swapoff first, which pushes everything in swap back into
# memory: exactly when it's short. So a wrong-sized file is reported, not changed.
- name: Report a swap file of a different size
  ansible.builtin.debug:
    msg: >-
      {{ swap_file_path }} is {{ (swap_file.stat.size / 1048576) | int }} MB, not
      {{ swap_file_size_mb }} MB, and is left as it is. To resize it, on the host run
      sudo swapoff {{ swap_file_path }} && sudo rm {{ swap_file_path }}, then run this again.
  when:
    - swap_file.stat.exists
    - swap_file.stat.size != (swap_file_size_mb | int) * 1048576

- name: Create the swap file, size in MB {{ swap_file_size_mb }}
  ansible.builtin.command:
    cmd: fallocate -l {{ swap_file_size_mb }}M {{ swap_file_path }}
    creates: "{{ swap_file_path }}"
  register: swap_created

- name: Restrict the swap file to root
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    owner: root
    group: root
    mode: "0600"
  # In check mode a new file wasn't really created
  when: swap_file.stat.exists or not ansible_check_mode

- name: Format the swap file
  ansible.builtin.command:
    cmd: mkswap {{ swap_file_path }}
  when: swap_created is changed and not ansible_check_mode
  changed_when: true

- name: Add the swap file to fstab
  ansible.posix.mount:
    path: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    state: present

- name: Check which swap is active
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false
  check_mode: false

- name: Turn the swap file on
  ansible.builtin.command:
    cmd: swapon {{ swap_file_path }}
  when:
    - swap_file_path not in swap_active.stdout_lines
    - not ansible_check_mode
  changed_when: true

- name: Set vm.swappiness to {{ swap_swappiness }}
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    sysctl_file: "{{ swap_sysctl_file }}"
    reload: true
