---
- name: Start with an empty site list
  ansible.builtin.set_fact:
    __nginx_proxy_sites: []
    __nginx_proxy_reload_needed: false

# Basic-auth passwords are left out of __nginx_proxy_sites: every later task
# loops over it, and a failed loop item is printed in full. Only auth.yml's
# no_log tasks read passwords, from nginx_proxy_sites.
- name: Apply site defaults
  ansible.builtin.set_fact:
    __nginx_proxy_sites: >-
      {{ __nginx_proxy_sites
         + [__nginx_proxy_site_defaults | combine({'domains': [item.name]}, item, __no_passwords)] }}
  vars:
    __user_names: >-
      {%- set ns = namespace(users=[]) -%}
      {%- for u in (item.auth.users | default([]) if item.auth is defined and item.auth is mapping else []) -%}
      {%-   set ns.users = ns.users + [{'name': u.name | default('') if u is mapping else ''}] -%}
      {%- endfor -%}
      {{ ns.users }}
    __no_passwords: >-
      {{ {'auth': item.auth | combine({'users': __user_names})}
         if item.auth is defined and item.auth is mapping else {} }}
  loop: "{{ nginx_proxy_sites }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: "{{ item.auth is defined }}"

- name: Check site names are unique and safe as filenames
  ansible.builtin.assert:
    that:
      - (__nginx_proxy_sites | map(attribute='name') | unique | length) == (__nginx_proxy_sites | length)
      - __nginx_proxy_sites | map(attribute='name') | reject('match', '^[A-Za-z0-9][A-Za-z0-9._-]*$') | list | length == 0
      - __nginx_proxy_sites | map(attribute='name') | select('in', [__nginx_proxy_default_site, 'default']) | list | length == 0
    fail_msg: >-
      nginx_proxy_sites names must be unique, made of letters, digits, dots,
      dashes or underscores, and not {{ __nginx_proxy_default_site }} or default.
    quiet: true

# Exactly one of upstream / redirect_to. No path, so proxy_pass passes the
# request URI through unchanged and a redirect appends it cleanly.
- name: Check each site has an upstream or a redirect, as scheme://host[:port] with no path
  ansible.builtin.assert:
    that:
      - (item.upstream is defined) != (item.redirect_to is defined)
      - (item.upstream | default(item.redirect_to | default(''))) is match('^https?://[^/\s]+$')
    fail_msg: >-
      {{ item.name }}: set exactly one of upstream or redirect_to, as
      scheme://host[:port] with no path or trailing slash.
    quiet: true
  loop: "{{ __nginx_proxy_sites }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check each site's basic auth
  ansible.builtin.assert:
    that:
      - item.redirect_to is not defined
      - item.auth is mapping
      - (__users | length > 0) or (__allow | length > 0)
      - __users | map(attribute='name', default='') | reject('match', '^[^:\\s]+$') | list | length == 0
      - (__users | map(attribute='name') | unique | length) == (__users | length)
      - __allow | map('string') | reject('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$') | list | length == 0
    fail_msg: >-
      {{ item.name }}: auth only goes on upstream sites, and needs users (each with a
      unique name without spaces or colons) or allow (IP addresses or CIDR ranges),
      or both.
    quiet: true
  vars:
    __users: "{{ item.auth.users | default([]) }}"
    __allow: "{{ item.auth.allow | default([]) }}"
  loop: "{{ __nginx_proxy_sites | selectattr('auth', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

# Reads the passwords, so no_log; a failure names only the site and user
- name: Check each basic-auth user has a one-line password
  ansible.builtin.assert:
    that: (item.1.password | default('') | string) is match('^[^\\n]+$')
    fail_msg: "{{ item.0.name }}: user {{ item.1.name | default('?') }} needs a password on one line."
    quiet: true
  loop: "{{ nginx_proxy_sites | selectattr('auth', 'defined') | subelements('auth.users', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1.name | default('?') }}"
  no_log: true

- name: Check no domain is claimed by two sites
  ansible.builtin.assert:
    that: (__domains | unique | length) == (__domains | length)
    fail_msg: "A domain appears in more than one present site. Domains: {{ __domains | sort | join(', ') }}"
    quiet: true
  vars:
    __domains: "{{ __nginx_proxy_sites | selectattr('state', 'eq', 'present') | map(attribute='domains') | flatten }}"

# For geerlingguy.certbot: certbot_certs: "{{ nginx_proxy_certbot_certs }}"
- name: Build the certbot certificate list
  ansible.builtin.set_fact:
    nginx_proxy_certbot_certs: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for s in __nginx_proxy_sites if s.state == 'present' and s.issue -%}
      {%-   set ns.out = ns.out + [{'name': s.name, 'domains': s.domains, 'webroot': nginx_proxy_acme_root}] -%}
      {%- endfor -%}
      {{ ns.out }}

- name: List the sites with basic-auth users
  ansible.builtin.set_fact:
    __nginx_proxy_auth_sites: >-
      {{ __nginx_proxy_sites | selectattr('state', 'eq', 'present') | selectattr('auth', 'defined')
         | selectattr('auth.users', 'defined') | rejectattr('auth.users', 'eq', []) | list }}
