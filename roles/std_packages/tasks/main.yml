---
- name: set time zone
  notify: Restart crond
  community.general.timezone:
    name: "{{ std_packages_timezone }}"

- name: profile.d config files
  ansible.builtin.copy:
    src: profile.d/
    dest: /etc/profile.d/
    owner: root
    group: adm
    mode: '0644'

- name: apt preference files
  when: std_packages_define_apt_preferences
  ansible.builtin.copy:
    src: apt/preferences.d/
    dest: /etc/apt/preferences.d/
    owner: root
    group: adm
    mode: '0640'

- name: install git
  ansible.builtin.apt:
    name:
      - git
    state: present

- name: unattended upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: install iperf3
  when: std_packages_install_iperf3
  ansible.builtin.apt:
    name:
      - iperf3
    state: present

- name: install rsync
  ansible.builtin.apt:
    name:
      - rsync
    state: present

- name: install crond
  ansible.builtin.apt:
    name:
      - cron
    state: present

- name: set crond to log only failed processes
  when: not std_packages_crond_log_processes
  notify: Restart crond
  ansible.builtin.lineinfile:
    path: /etc/default/cron
    state: present
    line: 'EXTRA_OPTS="-L 4"'

- name: set crond to also log failed processes
  when: std_packages_crond_log_processes
  notify: Restart crond
  ansible.builtin.lineinfile:
    path: /etc/default/cron
    state: present
    line: 'EXTRA_OPTS="-L 5"'
