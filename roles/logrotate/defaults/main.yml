---
# defaults file for logrotate

logrotate_package_state: present

# --- /etc/logrotate.conf ------------------------------------------------------
# Off by default: Debian's own file is left as it is. Turn it on to set the
# global defaults below. They apply to every file in /etc/logrotate.d that
# doesn't set its own value, the ones Debian packages ship included. The
# package's logrotate.conf is diverted to logrotate.conf.disabled, so upgrades
# don't ask about it. The defaults below are Debian's own values.
logrotate_global_manage: false
logrotate_global_frequency: weekly
logrotate_global_rotate: 4
logrotate_global_create: true
logrotate_global_compress: false
logrotate_global_dateext: false
logrotate_global_su: ""
logrotate_global_options: []

# --- /etc/logrotate.d ---------------------------------------------------------
# Logs that no role looks after, one file each. Each item takes the same keys
# as `logrotate_entry` (tasks_from: entry), see the README.
logrotate_entries: []

# Names in /etc/logrotate.d to clean up, such as the files this collection's
# 1.x logrotate role wrote. A file a Debian package owns is put back to the
# package's version (if it was changed); a file an entry has diverted is left
# to that entry; any other file is deleted.
logrotate_remove: []
