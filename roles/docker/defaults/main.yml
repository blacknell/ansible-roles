---
# defaults file for docker

# Users added to the 'docker' group so they can run docker without sudo.
# Empty means just linux_user_id, which must then be set by the playbook or
# inventory that consumes this role.
docker_users: []

# Written to /etc/docker/daemon.json when not empty, and validated with
# dockerd --validate first. Changing it restarts docker. For example:
#   docker_daemon_options:
#     log-driver: json-file
#     log-opts:
#       max-size: "10m"
#       max-file: "3"
#     live-restore: true
# Left empty, an existing daemon.json is not touched.
docker_daemon_options: {}

# State for the Docker engine packages. "present" installs them and leaves
# upgrades to the update_debian role (unattended-upgrades only covers Debian's
# own repos); "latest" upgrades them on every run and restarts docker.
docker_packages_state: present

# Distro packages that conflict with Docker's own, removed before install.
docker_obsolete_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker
  - containerd
  - runc
