---
# tasks file for docker

- name: Only aarch64 supported
  ansible.builtin.assert:
    that: "ansible_facts['architecture'] == 'aarch64' or ansible_facts['architecture'] == 'x86_64'"
    fail_msg: "architecture is not supported by this role"
    quiet: true

- name: Install dependent packages
  ansible.builtin.apt:
    name:
      - gnupg
      - python3-apt
      - python3-debian
      - ca-certificates
      - python3-cffi
      - python3-cryptography
    state: present

- name: Add Docker apt repository (deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg
  register: docker_repo

- name: Install docker engine
  notify: Restart docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_repo is changed }}"

# --validate stops a bad option from leaving docker unable to start.
- name: Write Docker daemon options to /etc/docker/daemon.json
  when: docker_daemon_options | length > 0
  notify: Restart docker
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    validate: dockerd --validate --config-file %s

- name: Read the docker group's members
  ansible.builtin.getent:
    database: group
    key: docker

# Only included when someone needs adding, because the connection reset
# inside it can't be made conditional on its own.
- name: Add users to the docker group
  when: docker_users_to_add | length > 0
  ansible.builtin.include_tasks: users.yml
  vars:
    docker_users_to_add: >-
      {{ docker_users_effective
         | difference(ansible_facts['getent_group']['docker'][2].split(',')) }}

- name: Enable & start daemon
  ansible.builtin.systemd:
    name: docker.service
    daemon_reload: true
    enabled: true
    state: started
