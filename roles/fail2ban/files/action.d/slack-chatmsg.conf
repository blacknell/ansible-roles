[Definition]

#(optional) Prevent notification/action for re-banned IPs when Fail2Ban restarts.
norestored = 1

actionstart =
actionstop =
actioncheck =

# Option:  actionban
actionban = curl -s -X POST 'https://slack.com/api/chat.postMessage' \
              -H "Authorization: Bearer <slack_bot_token>" \
              -H 'Content-type: application/json; charset=utf-8' \
              --data "{\"channel\":\"<slack_channel>\",\"text\":\"[<host_name>] Fail2Ban (<name>) banned IP *<ip>* :flag-<country_name>: (<country_name>) \",\"metadata\":{\"event_type\":\"fail2ban_ban\",\"event_payload\":{\"jail\":\"<name>\",\"ip\":\"<ip>\",\"host\":\"<host_name>\",\"country\":\"<country_name>\",\"banned_at\":\"<time>\"}}}"

# Option:  actionunban
actionunban =

[Init]

init = 'Sending chat message to Slack'

# The following are variables that will be evaluated at runtime in bash, thus cannot be used inside of single-quotes
host_name = $(hostname)
country_name = $(curl ipinfo.io/<ip>/country)
