# /etc/fail2ban/filter.d/joomla-recon-scan-slow.conf
#
# JAIL:  joomla-recon-scan-slow
# CLASS: low-and-slow reconnaissance
#
# Split out of joomla-recon-scan.conf on 31 July 2026 after the -slow jail
# (maxretry=3, findtime=1h) produced 1200+ bans overnight on vm23, traced
# to AhrefsBot (legit SEO crawler) tripping the generic bare-404 line by
# hitting stale/removed article URLs on a high-churn content site.
#
# A bare 404 is only a meaningful signal at speed (8 in 2 minutes, per the
# fast joomla-recon-scan jail) -- scattered over an hour it's just normal
# crawler/dead-link noise. Dropped here. Only the two signatures that are
# suspicious regardless of pace are kept: disclosure-path probing and
# known-bad-tool user agents.
#
[Definition]
failregex = (?i)^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"(?:GET|POST|HEAD) /(?:\.env|\.git/(?:config|HEAD)|composer\.json|composer\.lock|vendor/autoload\.php|phpinfo\.php|xmlrpc\.php|(?:install|installation)/(?:index\.php)?|(?:backup|db|dump)[^"\s]*\.(?:zip|sql|tar\.gz|tgz|bak))(?:\?[^"\s]*)? HTTP/\d\.\d" \d{3} \S+ "[^"]*" "[^"]*"
            (?i)^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"(?:GET|POST|HEAD) [^"\s]+ HTTP/\d\.\d" \d{3} \S+ "[^"]*" "(?:[^"]*\b)?(?:curl|python-requests|sqlmap|nikto|wpscan|Go-http-client|masscan|nmap|libwww-perl|Wget|sppb-rce-poc)(?:/[^"]*)?"

ignoreregex =