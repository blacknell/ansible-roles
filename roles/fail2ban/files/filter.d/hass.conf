# Fail2Ban configuration file for Home Assistant
#
# Custom regex patterns to ban known (and unwanted) access attempts.
# Based off https://www.home-assistant.io/integrations/fail2ban/
# Test with
#    fail2ban-regex /var/log/sandalwood/home-assistant.log hass --print-all-matched
#
# Author: Paul Blacknell https://github.com/blacknell

[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s.*Login attempt or request with invalid authentication from <HOST>.*$

ignoreregex =

[Init]
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
