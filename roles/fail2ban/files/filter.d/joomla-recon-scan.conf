# /etc/fail2ban/filter.d/joomla-recon-scan.conf
#
# JAIL:  joomla-recon-scan
# CLASS: reconnaissance / vulnerability scanning (rate-based, not single-hit)
#
# This filter combines three signals that are all fundamentally about
# *volume of scanning behaviour* rather than one damning request, so they
# share a single jail with rate-based thresholds instead of three
# separate ones:
#
# ------------------------------------------------------------------
# 1) Requests for common disclosure/recon targets
#    WHY: .env, .git/config, composer.json, composer.lock,
#    vendor/autoload.php, phpinfo.php, xmlrpc.php, the installation/
#    directory, and backup archives are all things that (a) do not exist
#    on a correctly hardened Joomla 5 install and (b) are near-universal
#    items on automated recon wordlists (they're framework-agnostic --
#    the same list is used against WordPress, Laravel, Symfony sites,
#    etc., which is exactly why they show up against Joomla hosts too).
#    Treated as rate-based here (rather than single-hit, as in the
#    exploit-attempt jail) because an isolated request to one of these
#    is unremarkable scanner background noise; a *pattern* of them from
#    one IP is what indicates targeted reconnaissance.
#    FALSE POSITIVES: very low. The only realistic legitimate case is a
#    developer's own CI/deploy process checking for a stray composer.json
#    left in the webroot -- exclude that source IP via ignoreip if so.
#
# 2) Generic 404 flood
#    WHY: catches wordlist-driven scanning that isn't on the specific
#    list above -- e.g. an attacker walking a list of hundreds of known
#    CVE paths (old Joomla components, other CMS paths, etc.). Any single
#    404 is normal (dead link, stale bookmark, a bot fetching a removed
#    page); a *burst* of them in a short window is not.
#    FALSE POSITIVES: controlled entirely via jail thresholds (high
#    maxretry, short findtime) and the ignoreregex below, which excludes
#    the handful of paths browsers/crawlers request unprompted on almost
#    any site (favicon, robots.txt, sitemap, apple-touch-icon).
#
# 3) OPTIONAL: known automated-tool User-Agent strings
#    WHY: sqlmap, nikto, wpscan, and default python-requests/curl/Go-http-
#    client/Wget/libwww-perl user agents are the default, un-spoofed
#    signature many scanning tools ship with. When one of these DOES
#    appear verbatim, it is essentially zero-false-positive (no real
#    browser sends "sqlmap/1.7" as its User-Agent).
#    IMPORTANT CAVEAT: this is a weak *detection* signal, not a weak
#    false-positive risk -- it under-detects rather than over-blocks.
#    Any competent attacker sets a normal browser User-Agent, so this
#    line will catch unsophisticated/default-configured tools and will
#    NOT catch a deliberately disguised attacker. Treat it as a bonus
#    layer, never as the primary control. Comment out the relevant
#    failregex line below to disable it without touching the rest of
#    the filter.
#
[Definition]

failregex = (?i)^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"(?:GET|POST|HEAD) /(?:\.env|\.git/(?:config|HEAD)|composer\.json|composer\.lock|vendor/autoload\.php|phpinfo\.php|xmlrpc\.php|(?:install|installation)/(?:index\.php)?|(?:backup|db|dump)[^"\s]*\.(?:zip|sql|tar\.gz|tgz|bak))(?:\?[^"\s]*)? HTTP/\d\.\d" \d{3} \S+ "[^"]*" "[^"]*"
            ^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"(?:GET|POST|HEAD) [^"\s]+ HTTP/\d\.\d" 404 \S+ "[^"]*" "[^"]*"
            (?i)^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"(?:GET|POST|HEAD) [^"\s]+ HTTP/\d\.\d" \d{3} \S+ "[^"]*" "(?:[^"]*\b)?(?:curl|python-requests|sqlmap|nikto|wpscan|Go-http-client|masscan|nmap|libwww-perl|Wget|sppb-rce-poc)(?:/[^"]*)?"

# Exclude common unprompted browser/crawler requests that legitimately
# 404 on a minimal or fresh install -- keeps the 404-flood line from
# penalising ordinary visitors for the site's own missing favicon etc.
ignoreregex = ^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"(?:GET|HEAD) /(?:favicon\.ico|robots\.txt|sitemap\.xml|apple-touch-icon[^"\s]*\.png) HTTP/\d\.\d" 404
