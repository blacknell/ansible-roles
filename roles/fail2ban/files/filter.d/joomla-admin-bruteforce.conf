# /etc/fail2ban/filter.d/joomla-admin-bruteforce.conf
#
# JAIL:  joomla-admin-bruteforce
# CLASS: administrator credential brute-forcing
#
# WHY THIS MATTERS FOR JOOMLA
#   /administrator/index.php is the single front door to every Joomla
#   back-end account. Automated brute-force tools (and simple credential-
#   stuffing scripts) hammer this endpoint with POST requests. Joomla's
#   com_login controller re-renders the login form with HTTP 200 on a
#   failed attempt and only issues a 303 redirect on success, so matching
#   "POST .../index.php ... 200" from the Apache access log approximates
#   "failed login" without needing PHP-level audit logs.
#
# FALSE-POSITIVE CONTROL
#   maxretry is intentionally forgiving (see jail.d) because real admins
#   mistype passwords. This filter is rate-based, not single-hit, by
#   design -- it is the one jail in this proposal where a single match is
#   expected to happen occasionally in normal operation.
#
[Definition]

failregex = ^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"POST /administrator/index\.php(?:\?[^"\s]*)? HTTP/\d\.\d" 200 \d+ "[^"]*" "[^"]*"
            ^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"POST /administrator/index\.php\?[^"\s]*option=com_ajax[^"\s]*(?:task|module)=[^"\s]*login[^"\s]*(?:&[^"\s]*)? HTTP/\d\.\d" \d{3} \d+ "[^"]*" "[^"]*"
            ^(?:\S+ )?<HOST> \S+ \S+\s*\[\]\s*"POST /api/index\.php/v1/(?:users/login|login)(?:\?[^"\s]*)? HTTP/\d\.\d" (?:200|401|403) \d+ "[^"]*" "[^"]*"

ignoreregex =
