# Fail2Ban configuration file for Frigate
#
# Custom regex patterns to ban known (and unwanted) access attempts.
# Test with
#    fail2ban-regex /var/log/apache2/access.log apache-frigate --print-all-matched

# DEV Notes:
# Current implementation in regex filters assumes vhost_combined type apache logs.
# E.g. LogFormat "%v:%p %h ...
#
# Author: Paul Blacknell https://github.com/blacknell

[Definition]

failregex = ^.+?:\d+ <HOST> -.* "(GET|POST|HEAD) /api/login *HTTP.*" (400|401) .*$

ignoreregex =
