---
argument_specs:
  main:
    short_description: Install Jenkins and its backups (default), or run a backup (tag backup_now)
    options: &all_options
      jenkins_docker_user:
        type: str
        required: true
        description: User that owns the compose project, is in the docker group and runs backups.
      jenkins_docker_compose_dir:
        type: path
        required: true
        description: Folder the compose project (docker-compose.yml, Dockerfile, plugins.txt, casc) is written to.
      jenkins_docker_volume:
        type: str
        required: true
        description: Docker volume mounted as JENKINS_HOME (exact name; created if missing).
      jenkins_docker_compose_project:
        type: str
        description: Compose project name. Defaults to the basename of jenkins_docker_compose_dir.
      jenkins_docker_image:
        type: str
        default: jenkins/jenkins:lts-jdk21
        description: Jenkins base image the controller is built from.
      jenkins_docker_plugins:
        type: list
        elements: str
        default: []
        description: Plugins baked into the image, as plugin-id or plugin-id:version.
      jenkins_docker_apt_packages:
        type: list
        elements: str
        default: []
        description: Extra Debian packages installed into the image.
      jenkins_docker_container_name:
        type: str
        default: jenkins
        description: Container name.
      jenkins_docker_container_user:
        type: str
        default: ""
        description: User the container runs as; empty for the image's jenkins user.
      jenkins_docker_ports:
        type: list
        elements: str
        default: ["8080:8080", "50000:50000"]
        description: Published ports, in compose host:container form.
      jenkins_docker_environment:
        type: dict
        default: {}
        description: Extra environment variables for the container.
      jenkins_docker_restart_policy:
        type: str
        default: unless-stopped
        description: Compose restart policy.
      jenkins_docker_docker_socket:
        type: bool
        default: false
        description: Mount /var/run/docker.sock so builds can run docker.
      jenkins_docker_casc:
        type: bool
        default: false
        description: Mount <compose_dir>/casc and set CASC_JENKINS_CONFIG to it.
      jenkins_docker_casc_src:
        type: str
        default: ""
        description: Folder on the Ansible controller whose files are copied into casc/.
      jenkins_docker_restore_file:
        type: str
        default: ""
        description: jenkins-home-<stamp>.tar.gz on the host to restore (restore entry point only).
      jenkins_docker_restore_force:
        type: bool
        default: false
        description: Empty and restore over a volume that already has data.
      jenkins_docker_backup_dir:
        type: path
        description: Folder the backup tarballs are written to. Defaults to <compose_dir>/backups.
      jenkins_docker_backup_script:
        type: path
        default: /usr/local/bin/jenkins-docker-backup
        description: Where the backup script is installed.
      jenkins_docker_backup_log:
        type: path
        default: /var/log/jenkins-docker-backup.log
        description: Log file appended to by scheduled and manual runs.
      jenkins_docker_backup_image:
        type: str
        default: debian:trixie-slim
        description: Image used to tar the volume (needs GNU tar).
      jenkins_docker_backup_stamp_format:
        type: str
        default: "%Y%m%d-%H%M%S"
        description: date(1) format for the timestamp in the filenames (no spaces or slashes).
      jenkins_docker_backup_keep_days:
        type: int
        default: 7
        description: Local tarballs older than this are deleted.
      jenkins_docker_backup_min_home_bytes:
        type: int
        default: 1048576
        description: A JENKINS_HOME tarball smaller than this fails the backup.
      jenkins_docker_backup_cron:
        type: bool
        default: true
        description: Whether to schedule the nightly backup.
      jenkins_docker_backup_cron_name:
        type: str
        default: jenkins backup
        description: Name of the cron entry.
      jenkins_docker_backup_cron_hour:
        type: str
        default: "3"
        description: Cron hour field.
      jenkins_docker_backup_cron_minute:
        type: str
        default: "15"
        description: Cron minute field.
      jenkins_docker_backup_excludes:
        type: list
        elements: str
        default: [workspace, caches, war, updates]
        description: Paths relative to JENKINS_HOME left out of the backup.
      jenkins_docker_backup_extra_excludes:
        type: list
        elements: str
        default: []
        description: Extra excludes added to jenkins_docker_backup_excludes.
      jenkins_docker_backup_config:
        type: bool
        default: true
        description: Also tar jenkins_docker_compose_dir.
      jenkins_docker_backup_config_excludes:
        type: list
        elements: str
        default: [.git]
        description: Paths relative to the compose folder left out of the config tarball.

  install:
    short_description: Write the compose project, build the image and start Jenkins
    options: *all_options

  backup_install:
    short_description: Install the backup script, log file and nightly cron entry
    options: *all_options

  backup_now:
    short_description: Run the installed backup now and verify the tarballs
    options: *all_options

  restore:
    short_description: Restore JENKINS_HOME from a backup tarball into the volume
    options: *all_options
