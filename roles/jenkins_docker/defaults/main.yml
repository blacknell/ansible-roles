---
# Required, no defaults (see meta/argument_specs.yml):
#   jenkins_docker_user          user that owns the compose project and runs backups
#   jenkins_docker_compose_dir   folder the compose project is written to
#   jenkins_docker_volume        docker volume mounted as JENKINS_HOME

# --- Install ----------------------------------------------------------------

# Compose project name. The volume keeps its exact name either way, but
# changing the project name on an existing install recreates the container.
jenkins_docker_compose_project: "{{ jenkins_docker_compose_dir | basename }}"

# Jenkins base image the controller is built from
jenkins_docker_image: jenkins/jenkins:lts-jdk21

# Plugins baked into the image, as plugin-id or plugin-id:version
jenkins_docker_plugins: []

# Extra Debian packages installed into the image (e.g. docker.io, git)
jenkins_docker_apt_packages: []

jenkins_docker_container_name: jenkins
# Run the container as this user ("" = the image's own jenkins user)
jenkins_docker_container_user: ""
jenkins_docker_ports:
  - "8080:8080"
  - "50000:50000"
jenkins_docker_environment: {}
jenkins_docker_restart_policy: unless-stopped

# Mount the host's Docker socket so builds can run docker
jenkins_docker_docker_socket: false

# Configuration as Code: mount <compose_dir>/casc and point CASC_JENKINS_CONFIG at it
jenkins_docker_casc: false
# Optional folder on the Ansible controller whose files are copied into casc/
jenkins_docker_casc_src: ""

# --- Restore ----------------------------------------------------------------

# A jenkins-home-<stamp>.tar.gz made by the backup script, already on the host.
# Only used by the restore entry point (--tags restore).
jenkins_docker_restore_file: ""
# Restore into a volume that already has data in it (it's emptied first)
jenkins_docker_restore_force: false

# --- Backups ----------------------------------------------------------------

# Where backup tarballs are written
jenkins_docker_backup_dir: "{{ jenkins_docker_compose_dir }}/backups"

# Backup script and log
jenkins_docker_backup_script: /usr/local/bin/jenkins-docker-backup
jenkins_docker_backup_log: /var/log/jenkins-docker-backup.log

# Image used to tar the volume (needs GNU tar)
jenkins_docker_backup_image: debian:trixie-slim

# Timestamp in the filenames (date(1) format; no spaces or slashes).
# Default gives jenkins-home-20261021-162836.tar.gz
jenkins_docker_backup_stamp_format: "%Y%m%d-%H%M%S"

# Delete local tarballs older than this many days
jenkins_docker_backup_keep_days: 7

# A home tarball smaller than this is treated as a failed backup
jenkins_docker_backup_min_home_bytes: 1048576

# Nightly schedule, run as jenkins_docker_user
jenkins_docker_backup_cron: true
jenkins_docker_backup_cron_name: jenkins backup
jenkins_docker_backup_cron_hour: "3"
jenkins_docker_backup_cron_minute: "15"

# Rebuildable folders left out of the JENKINS_HOME tarball
jenkins_docker_backup_excludes:
  - workspace
  - caches
  - war
  - updates
jenkins_docker_backup_extra_excludes: []

# Also tar the compose folder (compose file, Dockerfile, casc, ...)
jenkins_docker_backup_config: true
jenkins_docker_backup_config_excludes:
  - .git
